<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Test | LaboraX</title>
  <meta name="description" content="Book a diagnostic test or health package with LaboraX.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/laborax-template.css">

  <link rel="icon" type="image/x-icon" href="../../assets/images/logo/favicon.ico">
</head>
<body>

  <!-- Dynamic Header -->
  <header id="main-header" class="lx-header"></header>

  <main>
    <section class="lx-hero" style="padding: 60px 0 40px; text-align: center; background: linear-gradient(to bottom, rgba(var(--primary-red), 0.05), transparent);">
      <div class="lx-container">
        <span class="lx-eyebrow">QUICK BOOKING</span>
        <h1 class="lx-title" style="margin-bottom: 16px;">Schedule Your Appointment</h1>
        <p class="lx-copy" style="max-width: 600px; margin: 0 auto;">Select your preferred test or package, choose a convenient time, and get your diagnostics done safely at home or at our center.</p>
      </div>
    </section>

    <section class="lx-section">
      <div class="lx-container">
        <div class="lx-grid" style="--cols: 1; max-width: 800px; margin: 0 auto;">
          <form class="lx-card reveal stagger-up" style="display: flex; flex-direction: column; gap: 24px;">
            
            <!-- Step 1: Selection -->
            <div>
              <h3 style="margin-bottom: 16px; border-bottom: 1px solid rgb(var(--border-primary)); padding-bottom: 8px;">1. Select Test / Package</h3>
              <div class="lx-grid" style="--cols: 2; gap: 16px;">
                <div>
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgb(var(--text-muted));">Booking Type</label>
                  <select class="lx-input" style="width: 100%;">
                    <option>Health Package Subscription</option>
                    <option>Individual Lab Test</option>
                    <option>Home Collection Service</option>
                  </select>
                </div>
                <div>
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgb(var(--text-muted));">Specific Package</label>
                  <select class="lx-input" style="width: 100%;">
                    <option>Digital Wellness Subscription ($299/yr)</option>
                    <option>Family Digital Care Plan ($499/yr)</option>
                    <option>Senior Health Connect ($399/yr)</option>
                    <option>Complete Digital Diagnostic ($599/yr)</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Step 2: Patient Details -->
            <div>
              <h3 style="margin-bottom: 16px; border-bottom: 1px solid rgb(var(--border-primary)); padding-bottom: 8px;">2. Patient Details</h3>
              <div class="lx-grid" style="--cols: 2; gap: 16px;">
                <div>
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgb(var(--text-muted));">Full Name</label>
                  <input type="text" class="lx-input" style="width: 100%;" placeholder="John Doe">
                </div>
                <div>
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgb(var(--text-muted));">Phone Number</label>
                  <input type="tel" class="lx-input" style="width: 100%;" placeholder="+1 (555) 000-0000">
                </div>
                <div style="grid-column: 1 / -1;">
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgb(var(--text-muted));">Email Address</label>
                  <input type="email" class="lx-input" style="width: 100%;" placeholder="john@example.com">
                </div>
              </div>
            </div>

            <!-- Step 3: Date & Time -->
            <div>
              <h3 style="margin-bottom: 16px; border-bottom: 1px solid rgb(var(--border-primary)); padding-bottom: 8px;">3. Date & Time</h3>
              <div class="lx-grid" style="--cols: 2; gap: 16px;">
                <div>
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgb(var(--text-muted));">Preferred Date</label>
                  <input type="date" class="lx-input" style="width: 100%;">
                </div>
                <div>
                  <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: rgb(var(--text-muted));">Preferred Time Slot</label>
                  <select class="lx-input" style="width: 100%;">
                    <option>Morning (08:00 AM - 12:00 PM)</option>
                    <option>Afternoon (12:00 PM - 04:00 PM)</option>
                    <option>Evening (04:00 PM - 08:00 PM)</option>
                  </select>
                </div>
              </div>
            </div>
            
            <button type="button" class="lx-btn primary" style="width: 100%; padding: 16px; font-size: 16px; margin-top: 16px;" onclick="alert('Booking confirmed! Redirecting to Patient Dashboard...'); window.location.href='../dashboard/patient/bookings.html';">Confirm Subscription & Booking</button>

          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Dynamic Footer -->
  <footer id="main-footer" class="lx-footer"></footer>

  <!-- Scripts -->
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/theme.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/navigation.js"></script>
  <script src="../../assets/js/laborax-template.js"></script>
</body>
</html>
