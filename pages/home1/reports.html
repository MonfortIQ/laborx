<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Your Reports | LaboraX</title>
  
  <!-- CSS -->
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/laborax-template.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<header id="main-header" class="lx-header"></header>

<main>
  <!-- Hero Section -->
  <section class="lx-hero">
    <div class="lx-hero-shape"></div>
    <div class="lx-container lx-hero-container">
      <div class="lx-hero-content">
        <span class="lx-eyebrow">PATIENT REPORTS</span>
        <h1 class="lx-title">Secure Access to Your Lab Results</h1>
        <p class="lx-copy">Download and view your precise laboratory diagnostic reports anytime.</p>
        <div class="lx-hero-actions">
          <a href="tests.html" class="lx-btn primary">View My Reports <i class="bi bi-arrow-right"></i></a>
          
        </div>
      </div>
      <div class="lx-hero-visual">
        <img src="../../assets/images/home1/about/reports.jpg" alt="Secure Access to Your Lab Results">
        <div class="lx-floating-card">
          <i class="bi-file-medical"></i>
          <div>
            <strong>100%</strong>
            <span>Secure Data</span>
          </div>
        </div>
      </div>
    </div>
  </section>
  
  <!-- Content -->
  <section class="lx-section">
    <div class="lx-container" style="max-width:600px; margin:0 auto;">
      <form class="lx-card">
        <h2 class="lx-heading" style="margin-top:0;">Download Report</h2>
        <p style="margin-bottom:24px;">Enter your Patient ID or mobile number to securely download your laboratory reports.</p>
        <label style="font-weight:700; margin-bottom:8px; display:block;">Patient ID / Mobile Number</label>
        <input type="text" class="lx-input" placeholder="Enter ID or Number" style="margin-bottom:16px;" required>
        <label style="font-weight:700; margin-bottom:8px; display:block;">Date of Birth or Password</label>
        <input type="password" class="lx-input" placeholder="Enter DOB or Password" style="margin-bottom:24px;" required>
        <button class="lx-btn primary" type="submit" style="width:100%; justify-content:center;">Access Reports <i class="bi bi-lock-fill"></i></button>
      </form>
    </div>
  </section>
</main>

<footer id="main-footer" class="lx-footer"></footer>

<!-- Scripts -->
<script src="../../assets/js/auth.js"></script>
<script src="../../assets/js/theme.js"></script>
<script src="../../assets/js/main.js"></script>
<script src="../../assets/js/navigation.js"></script>
<script src="../../assets/js/laborax-template.js"></script>
</body>
</html>
